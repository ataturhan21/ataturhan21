name: Toggle Rocket in Profile README

on:
  schedule:
    - cron: "0 0 * * *"   # Runs every day at midnight UTC
  workflow_dispatch:       # Allow manual trigger too

permissions:
  contents: write

jobs:
  toggle-rocket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Run toggle script
        run: python .github/scripts/toggle_rocket.py

      - name: Commit changes
        run: |
          git config --global user.name "ata-turhan"
          git config --global user.email "ataturhan21@gmail.com"
          git add README.md
          git commit -m "chore: toggle rocket in README"
          git push
